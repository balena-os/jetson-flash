source "${LDK_DIR}/jetson-agx-orin-devkit.conf"

avt_update_flash_args_p3737_0000_p3701_0000()
{
    update_flash_args_p3737_0000_p3701_0000

	# Select the Base DTB based on SKU
	if [ "${board_sku}" = "0005" ]; then
		DTB_FILE=tegra234-p3737-0000+p3701-0005-nv-d315.dtb;
	else
		echo "Error: Unsupported module SKU ${board_sku}";
		exit 1;
	fi

	TBCDTB_FILE="${DTB_FILE}";
}

# update_flash_args:
update_flash_args()
{
	update_flash_args_common
	avt_update_flash_args_p3737_0000_p3701_0000
}
